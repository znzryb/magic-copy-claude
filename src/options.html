<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Magic Copy for Claude — 设置</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 18px 20px 22px;
    width: 320px;
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, "PingFang SC", sans-serif;
    background: #faf9f7; color: #1f1e1d;
  }
  h1 { margin: 0 0 2px; font-size: 15px; }
  .sub { margin: 0 0 16px; font-size: 12px; opacity: .6; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 0; }
  .row + .row { border-top: 1px solid rgba(0,0,0,.06); }
  label { flex: 1; }
  .hint { display: block; font-size: 11px; opacity: .55; margin-top: 1px; }
  select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid rgba(0,0,0,.2); background: #fff; color: inherit; }
  input[type=checkbox] { width: 16px; height: 16px; accent-color: #c96442; }
  kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(0,0,0,.07);
        border-radius: 4px; padding: 1px 5px; }
  .foot { margin-top: 16px; font-size: 11px; opacity: .55; }
  @media (prefers-color-scheme: dark) {
    body { background: #262624; color: #f5f4f2; }
    .row + .row { border-top-color: rgba(255,255,255,.09); }
    select { background: #1f1e1d; border-color: rgba(255,255,255,.2); }
    kbd { background: rgba(255,255,255,.12); }
  }
</style>
</head>
<body>
  <h1>Magic Copy for Claude</h1>
  <p class="sub">在 claude.ai 选中文字 → 复制为 Markdown（公式还原成 LaTeX）</p>

  <div class="row">
    <label for="enabled">启用<span class="hint">关掉后按钮和快捷键都不响应</span></label>
    <input type="checkbox" id="enabled">
  </div>
  <div class="row">
    <label for="showButton">显示划词按钮<span class="hint">选中后浮出「复制为 Markdown」</span></label>
    <input type="checkbox" id="showButton">
  </div>
  <div class="row">
    <label for="hotkey">启用快捷键<span class="hint"><kbd>⌥</kbd><kbd>⇧</kbd><kbd>C</kbd>（Alt+Shift+C）</span></label>
    <input type="checkbox" id="hotkey">
  </div>
  <div class="row">
    <label for="mathStyle">公式定界符</label>
    <select id="mathStyle">
      <option value="dollar">$x$ / $$x$$</option>
      <option value="paren">\(x\) / \[x\]</option>
    </select>
  </div>
  <div class="row">
    <label for="bullet">无序列表符号</label>
    <select id="bullet">
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="+">+</option>
    </select>
  </div>
  <div class="row">
    <label for="escapeText">转义特殊字符<span class="hint">把正文里的 <code>*</code> <code>[</code> 等转义，防止乱渲染</span></label>
    <input type="checkbox" id="escapeText">
  </div>
  <div class="row">
    <label for="keepLinks">保留链接</label>
    <input type="checkbox" id="keepLinks">
  </div>
  <div class="row">
    <label for="keepImages">保留图片</label>
    <input type="checkbox" id="keepImages">
  </div>
  <div class="row">
    <label for="trailingSource">附带来源链接<span class="hint">末尾加一行当前对话 URL</span></label>
    <input type="checkbox" id="trailingSource">
  </div>

  <p class="foot">改动即时生效，无需刷新页面。</p>

  <script src="options.js"></script>
</body>
</html>
